name: publish

# Builds the storefront/panels image and pushes it to GHCR as a
# multi-architecture manifest list: linux/amd64 for the Hostinger VPS,
# linux/arm64 for the Raspberry Pi 5 nodes.
#
# Unlike backend/bucket — which emulate arm64 with QEMU in a single job — this
# repo is PUBLIC, so GitHub's native arm64 runners (ubuntu-24.04-arm) are free
# here. That matters: this is the only one of the three with a real build step,
# and `next build` under emulation takes 15-30 minutes against roughly 3 native.
#
# The cost is shape: each architecture is built and pushed by digest in its own
# job, then a second job stitches the digests into one manifest list. That is
# the standard docker/build-push-action multi-platform pattern.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read
  packages: write

env:
  # Registry paths must be lowercase; the org is spelled "25INS003".
  IMAGE: ghcr.io/25ins003/web-app

jobs:
  # Gate. Without this the image shipped on every push with nothing run against
  # it — see docs/plan/07-phantom-implementations.md P5. Both build jobs depend
  # on it, so a red check means no image rather than a broken one on `latest`.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # No setup-qemu-action: each runner is already the target architecture.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitise platform for use in a filename
        id: plat
        run: echo "pair=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_OUTPUT"

      # Pushed by digest only — no tag. Tags are applied to the manifest list in
      # the merge job; tagging here would leave the two architectures racing to
      # own the same tag, and whichever finished last would win.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # The merge job reconstructs "IMAGE@sha256:<name>" from these filenames, so
      # the file is named after the bare digest with the algorithm prefix stripped.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.plat.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Assembles the per-architecture digests into one manifest list and applies
      # every tag to it.
      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Verify both architectures are present
        run: |
          docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}" \
            --format '{{ json .Manifest }}' | jq -r '.manifests[]?.platform | "\(.os)/\(.architecture)"'
