<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 540" width="1440" height="540" role="img" aria-label="Free delivery on orders over 199 rupees">
  <rect width="1440" height="540" fill="#1e2a24"/>
  <circle cx="1150" cy="300" r="300" fill="#2a3a31"/>
  <circle cx="1150" cy="300" r="200" fill="#33463b"/>
  <!-- A side-on scooter: box mounted over the rear wheel and attached to the
       deck, rather than floating above an abstract frame. -->
  <g transform="translate(950 186)">
    <ellipse cx="170" cy="232" rx="160" ry="14" fill="#000000" opacity="0.20"/>
    <rect x="18" y="26" width="128" height="98" rx="14" fill="#e0663c"/>
    <rect x="18" y="26" width="128" height="28" rx="14" fill="#c9552e"/>
    <path d="M44 86 h76 M44 106 h46" stroke="#fffaf6" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    <path d="M82 124 v34" stroke="#fffaf6" stroke-width="10" stroke-linecap="round"/>
    <path d="M56 164 h108 q40 0 56 -34" fill="none" stroke="#fffaf6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M220 130 l20 -64" fill="none" stroke="#fffaf6" stroke-width="14" stroke-linecap="round"/>
    <path d="M222 66 h48" stroke="#5aa87a" stroke-width="13" stroke-linecap="round"/>
    <circle cx="64" cy="180" r="40" fill="none" stroke="#fffaf6" stroke-width="14"/>
    <circle cx="248" cy="180" r="40" fill="none" stroke="#fffaf6" stroke-width="14"/>
  </g>
  <text x="110" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="700" fill="#fffaf6">Free delivery</text>
  <text x="110" y="308" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="700" fill="#f0a06e">over &#8377;199.</text>
  <text x="112" y="368" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="27" fill="#b9c7bf">Slots in as little as 30 minutes, from shops on your street.</text>
</svg>
