<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 540" width="1440" height="540" role="img" aria-label="Fresh groceries from the shops next door">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf6ee"/>
      <stop offset="1" stop-color="#f6e3d3"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="540" fill="url(#g1)"/>
  <circle cx="1210" cy="140" r="250" fill="#e0663c" opacity="0.10"/>
  <circle cx="1320" cy="440" r="170" fill="#5aa87a" opacity="0.12"/>

  <!-- Basket, moved right and given a handle so it reads as a basket rather
       than a plant pot. The fruit overlaps the rim so it sits IN it. -->
  <g transform="translate(1010 128)">
    <ellipse cx="150" cy="272" rx="180" ry="24" fill="#1e2a24" opacity="0.08"/>
    <path d="M40 84 a110 110 0 0 1 220 0" fill="none" stroke="#c9552e" stroke-width="12" stroke-linecap="round"/>
    <circle cx="98" cy="96" r="48" fill="#5aa87a"/>
    <path d="M98 48 q18 -30 44 -30 q-12 28 -38 34 Z" fill="#3f8b5c"/>
    <circle cx="176" cy="84" r="40" fill="#7bbf68"/>
    <circle cx="236" cy="104" r="34" fill="#e8a33d"/>
    <path d="M18 118 H282 L254 254 A28 28 0 0 1 226 278 H74 A28 28 0 0 1 46 254 Z" fill="#e0663c"/>
    <path d="M18 118 H282 L274 162 H26 Z" fill="#c9552e"/>
    <path d="M92 178 v66 M150 178 v72 M208 178 v66" stroke="#c9552e" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  </g>

  <text x="110" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="700" fill="#1e2a24">Fresh groceries,</text>
  <text x="110" y="246" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="700" fill="#1e2a24">from the shops</text>
  <text x="110" y="324" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="700" fill="#e0663c">next door.</text>
  <text x="112" y="382" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#4a5b52">Browse local shops, fill your basket, pay on delivery.</text>
  <g transform="translate(112 414)">
    <rect width="228" height="56" rx="28" fill="#e0663c"/>
    <text x="114" y="37" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#fffaf6">Start shopping</text>
  </g>
</svg>
