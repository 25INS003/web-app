<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 540" width="1440" height="540" role="img" aria-label="Pay cash when your order arrives">
  <rect width="1440" height="540" fill="#eef6f0"/>
  <path d="M0 400 Q360 300 720 372 T1440 330 V540 H0 Z" fill="#5aa87a" opacity="0.18"/>
  <circle cx="1200" cy="150" r="150" fill="#e0663c" opacity="0.12"/>
  <!-- A wallet, not a green rectangle: notes peeking out of the top, a flap
       across the body and a clasp to catch the eye. -->
  <g transform="translate(1000 150)">
    <ellipse cx="150" cy="258" rx="160" ry="18" fill="#1e2a24" opacity="0.08"/>
    <rect x="46" y="34" width="208" height="76" rx="10" fill="#fffaf6"/>
    <rect x="70" y="18" width="164" height="76" rx="10" fill="#f0c069"/>
    <text x="152" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#8a6218">&#8377;500</text>
    <rect x="0" y="78" width="300" height="168" rx="26" fill="#3f8b5c"/>
    <path d="M0 140 h300 v80 a26 26 0 0 1 -26 26 H26 A26 26 0 0 1 0 220 Z" fill="#347a4e"/>
    <circle cx="248" cy="184" r="26" fill="#e8a33d"/>
    <circle cx="248" cy="184" r="11" fill="#b8791f"/>
    <circle cx="42" cy="30" r="38" fill="#e8a33d"/>
    <text x="42" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#7a5312">&#8377;</text>
  </g>
  <text x="110" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="700" fill="#1e2a24">Pay when</text>
  <text x="110" y="314" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="700" fill="#3f8b5c">it arrives.</text>
  <text x="112" y="374" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="27" fill="#4a5b52">Cash on delivery on every order. No card, no app.</text>
</svg>
